[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyremote"
dynamic = ["version"]
description = "Turn a local function into a globally callable capability"
readme = "README.md"
license = "MIT"
authors = [{ name = "Silan Hu", email = "silan.hu@u.nus.edu" }]
maintainers = [{ name = "Silan Hu", email = "silan.hu@u.nus.edu" }]
keywords = [
    "capability",
    "distributed-computing",
    "easynet",
    "remote-execution",
    "verifiable-execution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Protocol truth enters through the generic EasyNet-Cli SDK runtime boundary.
# EasyRemote owns product profiles such as Mission and Agent lifecycle; the SDK
# owns Invocation/addressing/transport/error primitives and lower-layer Axon/C
# ABI delegation.
dependencies = [
    "easynet-sdk>=0.91.30",
    # Declared explicitly so uv applies the sibling source override while the
    # unpublished SDK/Axon cutover is tested as one local dependency graph.
    # EasyRemote production code still imports only easynet_sdk.
    "easynet-run-axon>=0.129.23",
]

[project.scripts]
easyremote = "easyremote._cli:main"

[project.urls]
Homepage = "https://github.com/Qingbolan/EasyRemote"
Repository = "https://github.com/Qingbolan/EasyRemote.git"
"Bug Tracker" = "https://github.com/Qingbolan/EasyRemote/issues"

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
gateway = ["cryptography>=42"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.13",
    "mypy>=1.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# Dev installs resolve the Daemon SDK from the sibling EasyNet-Cli checkout;
# release builds need the same package published under the easynet-sdk name.
easynet-sdk = { path = "../EasyNet-Cli/sdk/python", editable = true }
easynet-run-axon = { path = "../EasyNet-Axon/sdk/python", editable = true }

[tool.setuptools.dynamic]
version = { attr = "easyremote._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["easyremote*"]

[tool.setuptools.package-data]
easyremote = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: requires a running easynet-daemon",
]

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true
