[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easyremote"
dynamic = ["version"]
description = "Call private Python functions on trusted devices with typed decorators and EasyNet Runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Silan Hu", email = "silan.hu@u.nus.edu" }]
maintainers = [{ name = "Silan Hu", email = "silan.hu@u.nus.edu" }]
keywords = [
    "capability",
    "distributed-computing",
    "easynet",
    "remote-execution",
    "verifiable-execution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Protocol truth enters through the generic EasyNet-Cli SDK runtime boundary.
# EasyRemote owns product profiles such as Mission and Agent lifecycle; the CLI
# SDK owns Invocation/addressing/transport/error primitives and its lower-layer
# protocol implementation.
dependencies = [
    "easynet-sdk>=0.162.9,<0.163",
]

[project.scripts]
easyremote = "easyremote._cli:main"

[project.urls]
Homepage = "https://github.com/EasyRemote/EasyRemote"
Documentation = "https://github.com/EasyRemote/EasyRemote#readme"
Repository = "https://github.com/EasyRemote/EasyRemote"
Issues = "https://github.com/EasyRemote/EasyRemote/issues"
Changelog = "https://github.com/EasyRemote/EasyRemote/releases"

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
numpy = ["numpy>=1.26"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.13",
    "mypy>=1.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# Dev installs resolve the Daemon SDK from the sibling EasyNet-Cli checkout;
# release builds need the same package published under the easynet-sdk name.
easynet-sdk = { path = "../EasyNet-Cli/sdk/python", editable = true }

[tool.setuptools.dynamic]
version = { attr = "easyremote._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["easyremote*"]

[tool.setuptools.package-data]
easyremote = ["edge-adapter-policy.v1.json", "py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
mypy_path = [
    "../EasyNet-Cli/sdk/python",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: requires a running easynet-daemon",
]

[[tool.mypy.overrides]]
module = "easynet_sdk._axon_pb.*"
follow_imports = "skip"
ignore_errors = true
