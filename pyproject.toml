[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "easyremote"
dynamic = ["version"]
description = "Turn a local function into a globally callable capability"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Silan Hu", email = "silan.hu@u.nus.edu" }]
maintainers = [{ name = "Silan Hu", email = "silan.hu@u.nus.edu" }]
keywords = [
    "capability",
    "distributed-computing",
    "easynet",
    "remote-execution",
    "verifiable-execution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
requires-python = ">=3.10"
# 协议真相归 Axon：URA builder/parser、签名、回执验证都来自 easynet_axon
# （发布名 easynet-run-axon）。传输走平台 wheel 内置的 libeasynet_cli
# （SPEC §4.2）。除此之外零第三方依赖。
dependencies = ["easynet-run-axon>=0.108"]

[project.scripts]
easyremote = "easyremote._cli:main"

[project.urls]
Homepage = "https://github.com/Qingbolan/EasyRemote"
Repository = "https://github.com/Qingbolan/EasyRemote.git"
"Bug Tracker" = "https://github.com/Qingbolan/EasyRemote/issues"

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
gateway = ["cryptography>=42"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.13",
    "mypy>=1.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# Dev installs resolve the Axon SDK from the sibling checkout; release
# builds need it published (tracked with the PyPI naming open question).
easynet-run-axon = { path = "../EasyNet-Axon/sdk/python", editable = true }

[tool.setuptools.dynamic]
version = { attr = "easyremote._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["easyremote*"]

[tool.setuptools.package-data]
easyremote = ["py.typed", "_transport/_lib/**/*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: requires a running easynet-daemon",
]

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "easynet_axon.*"
ignore_missing_imports = true
