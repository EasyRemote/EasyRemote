# EasyRemote Python release
# Author: Silan Hu <silan.hu@u.nus.edu>
# Copyright 2024-2026 Silan Hu

name: Publish easyremote

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-easyremote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build easyremote
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.metadata.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve package metadata
        id: metadata
        run: |
          PACKAGE_VERSION="$(python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          if project["name"] != "easyremote":
              raise SystemExit(f"unexpected package name: {project['name']}")

          namespace = {}
          exec(pathlib.Path("easyremote/_version.py").read_text(encoding="utf-8"), namespace)
          print(namespace["__version__"])
          PY
          )"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            EXPECTED_TAG="v${PACKAGE_VERSION}"
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match ${EXPECTED_TAG}"
              exit 1
            fi
          else
            echo "Manual dispatch is validation-only; no package will be published."
          fi

      - name: Prove registry-only dependency resolution
        run: uv lock --no-sources --dry-run

      - name: Verify synchronized version projections
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: ./scripts/update-project-version.sh --check "${PACKAGE_VERSION}"

      - name: Require a forward PyPI version
        if: github.ref_type == 'tag'
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          LATEST_VERSION="$(
            curl --fail --silent --show-error https://pypi.org/pypi/easyremote/json |
              python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])'
          )"
          uv run --no-project --with packaging python - \
            "${PACKAGE_VERSION}" "${LATEST_VERSION}" <<'PY'
          import sys
          from packaging.version import Version

          candidate = Version(sys.argv[1])
          latest = Version(sys.argv[2])
          if candidate <= latest:
              raise SystemExit(
                  f"easyremote {candidate} must be newer than the current PyPI release {latest}"
              )
          PY

      - name: Install release dependencies
        run: uv sync --no-sources

      - name: Lint and type-check
        run: |
          uv run ruff check easyremote tests benchmarks --output-format=full
          uv run mypy easyremote

      - name: Test
        run: uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build --out-dir dist/easyremote

      - name: Validate distribution artifacts
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          uvx --from twine twine check dist/easyremote/*
          python - <<'PY'
          import email
          import os
          import pathlib
          import zipfile

          wheels = sorted(pathlib.Path("dist/easyremote").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist/easyremote").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one wheel and one sdist")

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_path = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_path))
              if "easyremote/_authority.py" in names:
                  raise SystemExit("retired authority policy leaked into the wheel")

          expected = {
              "Name": "easyremote",
              "Version": os.environ["EXPECTED_VERSION"],
              "License-Expression": "MIT",
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(
                      f"{key}={metadata.get(key)!r}, expected {value!r}"
                  )
          if "Silan Hu <silan.hu@u.nus.edu>" not in metadata.get("Author-email", ""):
              raise SystemExit("missing canonical author metadata")
          requires = metadata.get_all("Requires-Dist", [])
          if not any(item.startswith("easynet-sdk") for item in requires):
              raise SystemExit("missing canonical easynet-sdk dependency")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: easyremote-${{ steps.metadata.outputs.package_version }}
          path: dist/easyremote/
          if-no-files-found: error

  publish:
    name: Publish easyremote to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/easyremote
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: easyremote-${{ needs.build.outputs.package_version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
