name: README facts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  readme-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_readme_facts.py --self-test
      - run: python3 scripts/check_readme_facts.py
