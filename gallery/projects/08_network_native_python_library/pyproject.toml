[project]
name = "easyremote-gallery-network-native-python-library"
version = "0.1.0"
description = "A standalone EasyRemote network-native Python library use case"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "easyremote",
    "easynet-sdk>=0.162.9,<0.163",
]

[tool.uv.sources]
easyremote = { path = "../../..", editable = true }
easynet-sdk = { path = "../../../../EasyNet-Cli/sdk/python", editable = true }

[dependency-groups]
dev = ["ruff>=0.13"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
